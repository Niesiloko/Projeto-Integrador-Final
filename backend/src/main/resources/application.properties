# Nome da aplicação
spring.application.name=conectaevent

# URL de conexão com o MySQL.
# Cria o banco caso ele não exista.
# Sem serverTimezone: a conexão usa o mesmo fuso da JVM e do MySQL (o da máquina),
# assim as datas do import.sql (NOW()) e o LocalDateTime.now() do Java batem.
# ${VARIAVEL:padrão}: usa a variável de ambiente se ela existir (na nuvem); senão, o valor padrão (Codespaces).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/conectaevent?createDatabaseIfNotExist=true}

# Usuário e senha do MySQL (criados pelo .devcontainer/init-mysql.sh)
spring.datasource.username=${DB_USERNAME:conecta}
spring.datasource.password=${DB_PASSWORD:conecta123}

# Driver utilizado para conectar ao MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Recria as tabelas ao iniciar e carrega os dados de exemplo do import.sql
spring.jpa.hibernate.ddl-auto=create

# Exibe os comandos SQL no console
spring.jpa.show-sql=true

# Formata os comandos SQL exibidos no console
spring.jpa.properties.hibernate.format_sql=true

# Define o dialeto do Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Na nuvem, o Render informa a porta pela variável PORT
server.port=${PORT:8080}
