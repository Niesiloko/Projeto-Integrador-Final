# Nome da aplicação
spring.application.name=conectaevent

# URL de conexão com o MySQL.
# Cria o banco caso ele não exista.
# serverTimezone define o fuso horário utilizado na conexão.
spring.datasource.url=jdbc:mysql://localhost:3306/conectaevent?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo

# Usuário e senha do MySQL (criados pelo .devcontainer/init-mysql.sh)
spring.datasource.username=conecta
spring.datasource.password=conecta123

# Driver utilizado para conectar ao MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Recria as tabelas ao iniciar e carrega os dados de exemplo do import.sql
spring.jpa.hibernate.ddl-auto=create

# Exibe os comandos SQL no console
spring.jpa.show-sql=true

# Formata os comandos SQL exibidos no console
spring.jpa.properties.hibernate.format_sql=true

# Define o dialeto do Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Datas da API no fuso de Brasília
spring.jackson.time-zone=America/Sao_Paulo

server.port=8080
