# Perfil "nuvem": só vale quando a variável SPRING_PROFILES_ACTIVE=nuvem está definida (o Dockerfile define).
# O que não aparece aqui vem do application.properties.

# Sem o SQL no console: em produção isso só ocupa espaço no log
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Fuso de Brasília no banco. Os servidores na nuvem usam UTC; sem isto, o NOW() do import.sql
# (datas dos eventos) e o LocalDateTime.now() do Java (regra das 48 h) ficariam 3 horas diferentes.
# O Dockerfile também coloca o Java no fuso America/Sao_Paulo.
spring.datasource.hikari.connection-init-sql=SET time_zone = '-03:00'

# Plano gratuito tem pouca memória: poucas conexões com o banco bastam
spring.datasource.hikari.maximum-pool-size=5
