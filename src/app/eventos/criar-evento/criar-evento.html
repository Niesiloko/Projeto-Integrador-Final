<app-navbar></app-navbar>
<div class="page-container">
  <mat-card appearance="outlined" class="form-card">
    <mat-card-header>
      <mat-card-title>Criar Novo Evento</mat-card-title>
      <mat-card-subtitle>Preencha as informações principais para publicar seu evento</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field appearance="outline">
        <mat-label>Título do Evento</mat-label>
        <input matInput [(ngModel)]="evento.titulo" placeholder="Ex: Workshop de Angular e Spring Boot" required>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Categoria</mat-label>
        <input matInput [(ngModel)]="evento.categoria" placeholder="Ex: Tecnologia, Esportes, Corporativo">
      </mat-form-field>

      <div class="row-inputs">
        <mat-form-field appearance="outline">
          <mat-label>Data e Horário</mat-label>
          <input matInput type="datetime-local" [(ngModel)]="evento.data">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Local / Endereço</mat-label>
          <input matInput [(ngModel)]="evento.local" placeholder="Ex: Auditório Central - UNIFIO">
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Descrição Completa</mat-label>
        <textarea matInput [(ngModel)]="evento.descricao" rows="5" placeholder="Detalhes sobre a programação, palestrantes..."></textarea>
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-button routerLink="/meus-eventos">Cancelar</button>
      <button mat-flat-button color="primary" class="btn-primary-sympla" (click)="salvarEvento()">Publicar Evento</button>
    </mat-card-actions>
  </mat-card>
</div>
