<div class="page-container">
  <h2>Meus Ingressos</h2>

  <div class="tickets-grid">
    <mat-card appearance="outlined" *ngFor="let ing of ingressos" class="ticket-card">
      <div class="ticket-header">
        <span class="badge">Confirmado</span>
        <h3>{{ ing.eventoNome }}</h3>
      </div>

      <div class="ticket-divider"></div>

      <mat-card-content class="ticket-body">
        <div class="info">
          <mat-icon>event</mat-icon>
          <div>
            <small>Data</small>
           <span>{{ ing.data | date:'dd/MM/yyyy HH:mm' }}</span>
          </div>
        </div>

        <div class="info">
          <mat-icon>place</mat-icon>
          <div>
            <small>Local</small>
            <span>{{ ing.local }}</span>
          </div>
        </div>

        <div class="info">
          <mat-icon>person</mat-icon>
          <div>
            <small>Participante</small>
            <span>{{ ing.titular }}</span>
          </div>
        </div>

        <div class="qrcode" *ngIf="valido(ing); else invalido">
  <img *ngIf="qrs[ing.id]" [src]="qrs[ing.id]" alt="QR Code do ingresso" />
  <small>{{ ing.codigo }}</small>
  <span>Apresente na entrada</span>
</div>

<ng-template #invalido>
  <div class="qrcode-placeholder">
    <mat-icon>block</mat-icon>
    <span>QR Code indisponível ({{ rotulo(ing.status) }})</span>
  </div>
</ng-template>

<button mat-stroked-button class="btn-reembolso" *ngIf="ing.status === 'CONFIRMADO'" (click)="reembolsar(ing)">
  Solicitar reembolso
</button>
      </mat-card-content>
    </mat-card>
  </div>
</div>
